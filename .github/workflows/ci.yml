# Fast sanity check on every push/PR: shell lint + JSON validation + (optional) a build smoke test.
# The real build lives in release.yml; keep this cheap.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
shellcheck -S error -s sh module/*.sh
shellcheck -S error .github/scripts/*.sh

      - name: Validate JSON
        run: |
          for f in module/update.json module/update-*.json module/webroot/config.json module/webroot/lang/*.json; do
            [ -e "$f" ] || continue
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok $f"
          done

      # Kit guards (STANDARDS.md §1/§7.1/§8): run the kit's own checkers against this repo.
      - name: Kit guards (release-workflow-lint + vendor-parity)
        run: |
          # release-workflow-lint: no draft-publish anti-pattern in this repo's release workflows
          # (release must publish directly from CI so author=github-actions[bot]). STANDARDS §7.1.
          lint=""
          for c in .github/scripts/release-workflow-lint.sh tooling/release-workflow-lint.sh; do
            [ -f "$c" ] && { lint="$c"; break; }
          done
          if [ -n "$lint" ]; then sh "$lint" .; else echo "release-workflow-lint.sh not vendored (skip)"; fi
          # vendor-parity: every vendored kit-tool copy must have the SAME LOGIC as the canonical
          # (banner preserved). STANDARDS §8. Needs VD-ModuleKit's tooling/ as the reference, so
          # check the kit out beside this repo (../VD-ModuleKit) for this step to run.
          vp=""
          for c in tooling/vendor-parity.sh ../VD-ModuleKit/tooling/vendor-parity.sh; do
            [ -f "$c" ] && { vp="$c"; break; }
          done
          if [ -n "$vp" ]; then sh "$vp" .; else echo "vendor-parity.sh unavailable (check out VD-ModuleKit beside this repo to run it); skip"; fi

      # Engine parity (STANDARDS §8): the VDLU engine (module/vdlu/) is vendored from a SEPARATE
      # canonical repo (VDLiveUpdate), OUTSIDE vendor-parity's filename scope. This guards the
      # vendored engine logic + ENGINE_VERSION + keyring against the canonical, so a silent engine
      # drift (e.g. a weaker path validator at an unchanged ENGINE_VERSION) fails loud. It SKIPs
      # cleanly for an app-only repo (no module/vdlu) and when the canonical is not checked out
      # beside this repo (../VDLiveUpdate), so CI without it does not break.
      - name: Engine parity (vendored VDLU engine vs canonical)
        run: |
          ep=""
          for c in tooling/engine-parity.sh ../VD-ModuleKit/tooling/engine-parity.sh; do
            [ -f "$c" ] && { ep="$c"; break; }
          done
          if [ -n "$ep" ]; then sh "$ep" .; else echo "engine-parity.sh unavailable (check out VD-ModuleKit beside this repo to run it); skip"; fi

      # NOTE: the 4-ABI gate (tooling/abi-lint.sh) and the zip weight / lite-cap report
      # (tooling/size-report.sh) run in release.yml against the BUILT output (the pruned per-variant
      # trees and the final flashable zips), not here - this job stays cheap and build-free.

      # Module-specific sanity build goes here (JDK/SDK/NDK, dex, native, zip smoke test).
