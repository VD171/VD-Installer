# Binary refresh (SKELETON). Keep the bundled, pre-compiled upstream binaries fresh BETWEEN feature
# releases. Scheduled weekly: re-fetch the latest upstream; if any pinned version changed, do a .patch
# bump (v1.01 -> v1.01.1 -> v1.01.2 ...) and publish a "binary refresh" release with the new zip.
# A run with no upstream change does nothing. Fill in the module-specific build/compare/package steps;
# keep the conventions below. See VD-Backup's bin-refresh workflow for a full worked example.
#
# House conventions (keep these):
#  - Track the upstream version set in a lockfile (e.g. .github/bin-versions.lock); compare each run so
#    an unchanged run is a no-op and only a real change triggers a bump + release.
#  - Per-binary provenance (source + version + sha256) lives beside each binary (bin/<abi>/PROVENANCE.json).
#  - Bump with .github/scripts/version.sh patch (prefix SCHEME=minor if the module uses the minor scheme);
#    never hand-edit versionCode.
#  - Run tooling/gen-sha256.sh on each pruned variant tree, before that variant's zip.
#  - Pin every third-party action by commit SHA, not a tag (supply-chain safety).
#  - Any commit uses the github-actions[bot] identity; the CI PUBLISHES the release directly
#    (author = github-actions[bot]), token = ${{ secrets.GITHUB_TOKEN }}. NEVER `draft: true` + manual UI
#    "Publish" (that attributes the release to the human who clicks). Enforced by
#    tooling/release-workflow-lint.sh + audited by tooling/release-author-audit.sh.

name: Binary refresh

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC (stagger per module)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ---- fetch upstream + decide if anything changed (fill these in) ----------------
      # - name: Build per-ABI binaries (latest upstream)   # e.g. bash .github/scripts/build_bin.sh
      # - name: Compare upstream versions to the lock      # id: chk -> state=baseline|unchanged|changed
      #         (diff the freshly derived version set against .github/bin-versions.lock)
      # - name: Up to date                                 # if state == unchanged: echo + stop
      # - name: Seed the lock (first run, no release)      # if state == baseline: commit the lock, stop
      # ---------------------------------------------------------------------------------

      # ---- a real upstream change: build everything, patch-bump, release (fill in) -----
      # Guard every step below with: if: steps.chk.outputs.state == 'changed'
      # - name: Set up build toolchain (JDK/SDK/NDK as the module needs)
      # - name: Patch-bump version           # .github/scripts/version.sh patch
      # - name: Stage README + LICENSE + refresh the lock
      # - name: Assemble release zips         # prune to one ABI per variant; run gen-sha256.sh before each zip
      # - name: Fill update.json size/sha256/notes (per-variant manifests; MMRL stub <50MB)
      # ---------------------------------------------------------------------------------

      - name: Commit binary refresh
        # if: steps.chk.outputs.state == 'changed'
        run: |
          VER="$(.github/scripts/version.sh read | sed 's/^version=//; s/ .*//')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: binary refresh ${VER}"
            git push
          fi

      - name: Create GitHub release
        # if: steps.chk.outputs.state == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(.github/scripts/version.sh read | sed 's/^version=//; s/ .*//')"
          gh release create "${VER}" --title "VD INSTALLER ${VER} (binary refresh)" --generate-notes ./*.zip

      # Fail-closed guard: if the token was ever swapped for a user PAT, the release ships under that
      # human; this catches it in CI instead of silently.
      - name: Assert release author is github-actions[bot]
        # if: steps.chk.outputs.state == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(.github/scripts/version.sh read | sed 's/^version=//; s/ .*//')"
          author="$(gh release view "${VER}" --json author -q '.author.login')"
          [ "$author" = "github-actions[bot]" ] || { echo "::error::release ${VER} authored by ${author}, not github-actions[bot]"; exit 1; }
