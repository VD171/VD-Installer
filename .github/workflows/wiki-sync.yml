# Mirror docs/ into the project Wiki. docs/ stays the source of truth; this copies it into the
# separate <repo>.wiki.git so the same content is browsable at /wiki/. Initialize the Wiki once
# (create any page in the web UI) before the first run, or the wiki clone has no repo.

name: Wiki sync

on:
  push:
    branches: [main, master]
    paths: ['docs/**', '.github/workflows/wiki-sync.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mirror docs/ into the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          bash .github/scripts/gen_wiki.sh docs wiki
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "docs: sync from docs/ @ ${GITHUB_SHA}"
            git push
          fi
